[package]
name = "customer-support-cli"
version = "0.1.0"
edition = "2024"
description = "Deterministic customer support triage and queue operations CLI"
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/customer-support-cli"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "677c849044659ce17ca63d571293b69901a8e87a", features = ["cli-output"] }
